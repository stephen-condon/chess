<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="menu" class="menu-overlay">
      <div class="menu-card">
        <div id="menu-home">
          <h1 class="menu-title">♟ Chess</h1>
          <button id="menu-new-game" class="btn">New Game</button>
          <button id="menu-preferences" class="btn" disabled>Preferences</button>
        </div>

        <div id="menu-config" hidden>
          <h2 class="menu-config-title">New Game</h2>
          <div class="config-row" id="menu-mode-row">
            <label>Mode</label>
            <div class="toggle-group">
              <button class="toggle active" data-val="computer">vs Computer</button>
              <button class="toggle" data-val="hotseat">Hotseat</button>
            </div>
          </div>
          <div class="config-row" id="menu-side-row">
            <label>Play as</label>
            <div class="toggle-group">
              <button class="toggle active" data-val="white">White</button>
              <button class="toggle" data-val="black">Black</button>
            </div>
          </div>
          <div class="config-row" id="menu-difficulty-row">
            <label>Difficulty</label>
            <select id="cfg-difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="config-actions">
            <button id="menu-back" class="btn secondary">Back</button>
            <button id="menu-play" class="btn">Play</button>
          </div>
        </div>

        <div id="menu-prefs" hidden>
          <h2 class="menu-config-title">Preferences</h2>
          <p class="menu-empty">Nothing here yet.</p>
          <button id="menu-prefs-back" class="btn secondary">Back</button>
        </div>
      </div>
    </div>

    <main id="app" class="app" hidden>
      <section class="board-area">
        <div id="board" class="board" aria-label="Chess board"></div>
      </section>

      <aside class="panel">
        <h1 class="title">Chess</h1>

        <div id="status" class="status">White to move</div>

        <div class="controls">
          <button id="menu-btn" class="btn">Menu</button>
          <button id="new-game" class="btn">New Game</button>
          <button id="flip" class="btn">Flip</button>
          <button id="undo" class="btn">Undo</button>
        </div>

        <div class="moves-wrap">
          <h2 class="subtitle">Moves</h2>
          <ol id="moves" class="moves"></ol>
        </div>

        <details class="io">
          <summary>Import / Export</summary>
          <div class="io-body">
            <label for="fen">FEN</label>
            <div class="io-row">
              <input id="fen" type="text" spellcheck="false" />
              <button id="load-fen" class="btn small">Load</button>
              <button id="copy-fen" class="btn small">Copy</button>
            </div>

            <label for="pgn">PGN</label>
            <textarea id="pgn" rows="6" spellcheck="false"></textarea>
            <div class="io-row">
              <button id="load-pgn" class="btn small">Import</button>
              <button id="export-pgn" class="btn small">Export</button>
            </div>

            <div class="io-row">
              <label for="analysis-speed" class="sr-only">Analysis speed</label>
              <select id="analysis-speed">
                <option value="fast">Fast</option>
                <option value="balanced" selected>Balanced</option>
                <option value="deep">Deep</option>
              </select>
              <button id="analyze-game" class="btn small" disabled>Analyze Game</button>
            </div>
            <p id="analysis-progress" class="analysis-progress" hidden></p>
            <div id="analysis-summary" class="analysis-summary" hidden></div>
          </div>
        </details>

        <p id="io-error" class="io-error" role="alert"></p>
      </aside>
    </main>

    <!-- Promotion picker overlay -->
    <div id="promotion" class="promotion" hidden>
      <div class="promotion-box">
        <p>Promote to:</p>
        <div class="promotion-choices">
          <button data-piece="q" class="promo-btn">♛</button>
          <button data-piece="r" class="promo-btn">♜</button>
          <button data-piece="b" class="promo-btn">♝</button>
          <button data-piece="n" class="promo-btn">♞</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
