<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="board-area">
        <div id="board" class="board" aria-label="Chess board"></div>
      </section>

      <aside class="panel">
        <h1 class="title">Chess</h1>

        <div id="status" class="status">White to move</div>

        <div class="controls">
          <button id="new-game" class="btn">New Game</button>
          <button id="flip" class="btn">Flip</button>
          <button id="undo" class="btn">Undo</button>
        </div>

        <div class="control-row">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="hotseat">Hotseat (2 players)</option>
            <option value="computer">Vs Computer</option>
          </select>
        </div>

        <div class="control-row" id="side-row" hidden>
          <label for="human-side">Play as</label>
          <select id="human-side">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </div>

        <div class="control-row" id="difficulty-row" hidden>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="moves-wrap">
          <h2 class="subtitle">Moves</h2>
          <ol id="moves" class="moves"></ol>
        </div>

        <details class="io">
          <summary>Import / Export</summary>
          <div class="io-body">
            <label for="fen">FEN</label>
            <div class="io-row">
              <input id="fen" type="text" spellcheck="false" />
              <button id="load-fen" class="btn small">Load</button>
              <button id="copy-fen" class="btn small">Copy</button>
            </div>

            <label for="pgn">PGN</label>
            <textarea id="pgn" rows="6" spellcheck="false"></textarea>
            <div class="io-row">
              <button id="load-pgn" class="btn small">Import</button>
              <button id="export-pgn" class="btn small">Export</button>
            </div>

            <div class="io-row">
              <label for="analysis-speed" class="sr-only">Analysis speed</label>
              <select id="analysis-speed">
                <option value="fast">Fast</option>
                <option value="balanced" selected>Balanced</option>
                <option value="deep">Deep</option>
              </select>
              <button id="analyze-game" class="btn small" disabled>Analyze Game</button>
            </div>
            <p id="analysis-progress" class="analysis-progress" hidden></p>
            <div id="analysis-summary" class="analysis-summary" hidden></div>
          </div>
        </details>

        <p id="io-error" class="io-error" role="alert"></p>
      </aside>
    </main>

    <!-- Promotion picker overlay -->
    <div id="promotion" class="promotion" hidden>
      <div class="promotion-box">
        <p>Promote to:</p>
        <div class="promotion-choices">
          <button data-piece="q" class="promo-btn">♛</button>
          <button data-piece="r" class="promo-btn">♜</button>
          <button data-piece="b" class="promo-btn">♝</button>
          <button data-piece="n" class="promo-btn">♞</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
